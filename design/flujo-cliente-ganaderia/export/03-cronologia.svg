family="DejaVu Sans" font-size="18.5" font-weight="700" fill="#1c2b22" text-anchor="start">El sistema aprende</text><text x="286" y="1462" font-family="DejaVu Sans" font-size="11.5" font-weight="700" fill="#b4522a" text-anchor="start" letter-spacing="0.8">MÓDULO 5 · ANALÍTICA E IA</text><circle cx="294" cy="1494" r="3.6" fill="#c78a5f"/><text x="308" y="1498" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">Modelos predictivos de efectividad reproductiva y alertas sanitarias</text><circle cx="294" cy="1525" r="3.6" fill="#c78a5f"/><text x="308" y="1529" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">Los datos ya se capturan desde la fase 1: no hay que reconstruir historial</text><rect x="286" y="1562" width="185.6" height="23.5" rx="11.75" fill="#f7e8df" stroke="#ecd3c5" stroke-width="1"/><text x="378.8" y="1577.89" font-family="DejaVu Sans" font-size="11.5" font-weight="700" fill="#b4522a" text-anchor="middle">Fuera del MVP por diseño</text><rect x="217" y="246" width="2" height="1164" fill="#d4e2d8"/><circle cx="218" cy="246" r="8" fill="#fff" stroke="#2e7d4f" stroke-width="3"/><circle cx="218" cy="537" r="8" fill="#fff" stroke="#2e7d4f" stroke-width="3"/><circle cx="218" cy="828" r="8" fill="#fff" stroke="#2e7d4f" stroke-width="3"/><circle cx="218" cy="1119" r="8" fill="#fff" stroke="#2e7d4f" stroke-width="3"/><circle cx="218" cy="1410" r="8" fill="#fff" stroke="#c78a5f" stroke-width="3"/><text x="48" y="1624" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#8a9a90" text-anchor="start">Fuente: plan de trabajo v2 (docs/plan-de-trabajo.md) · alcance MoSCoW y hoja de ruta de 12 semanas</text></svg>