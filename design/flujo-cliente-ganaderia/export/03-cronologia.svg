<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1646" viewBox="0 0 1200 1646"><rect width="1200" height="1646" fill="#faf7f1"/><text x="48" y="88" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#1c2b22" text-anchor="start" letter-spacing="1">QUÉ RECIBE EL CLIENTE, SEMANA A SEMANA</text><text x="48" y="134" font-family="DejaVu Sans" font-size="15.5" font-weight="400" fill="#4a5a50" text-anchor="start">La hoja de ruta de 12 semanas vista desde el cliente: cuándo puede hacer algo nuevo, y qué queda, con</text><text x="48" y="156" font-family="DejaVu Sans" font-size="15.5" font-weight="400" fill="#4a5a50" text-anchor="start">espacio, para después del MVP.</text><text x="190" y="250" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#14532d" text-anchor="end">Semanas 1–3</text><text x="190" y="268" font-family="DejaVu Sans" font-size="11" font-weight="700" fill="#8a9a90" text-anchor="end" letter-spacing="0.6">FASE 1</text><rect x="260" y="222" width="892" height="245" rx="16" fill="#ffffff" stroke="#e3ddd2" stroke-width="1"/><text x="286" y="272" font-family="DejaVu Sans" font-size="18.5" font-weight="700" fill="#1c2b22" text-anchor="start">La cuenta está lista y ya hay un flujo andando</text><text x="286" y="298" font-family="DejaVu Sans" font-size="11.5" font-weight="700" fill="#2e7d4f" text-anchor="start" letter-spacing="0.8">MÓDULO 1 · SAAS · USUARIOS · EQUIPOS</text><circle cx="294" cy="330" r="3.6" fill="#2e7d4f"/><text x="308" y="334" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">Registrá la empresa, los usuarios con sus roles y los equipos de trabajo</text><circle cx="294" cy="361" r="3.6" fill="#2e7d4f"/><text x="308" y="365" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">Activaste tu plan y confirmaste la propiedad</text><circle cx="294" cy="392" r="3.6" fill="#2e7d4f"/><text x="308" y="396" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">Primer flujo completo probado: alta de animal → fase del protocolo → insumo descontado</text><rect x="286" y="429" width="95.89999999999999" height="23.5" rx="11.75" fill="#e4efe6" stroke="#cfe0d4" stroke-width="1"/><text x="333.95" y="444.89" font-family="DejaVu Sans" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">Alcance MVP</text><text x="190" y="541" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#14532d" text-anchor="end">Semanas 4–6</text><text x="190" y="559" font-family="DejaVu Sans" font-size="11" font-weight="700" fill="#8a9a90" text-anchor="end" letter-spacing="0.6">FASE 2</text><rect x="260" y="513" width="892" height="245" rx="16" fill="#ffffff" stroke="#e3ddd2" stroke-width="1"/><text x="286" y="563" font-family="DejaVu Sans" font-size="18.5" font-weight="700" fill="#1c2b22" text-anchor="start">El depósito y el semen quedan bajo control</text><text x="286" y="589" font-family="DejaVu Sans" font-size="11.5" font-weight="700" fill="#2e7d4f" text-anchor="start" letter-spacing="0.8">MÓDULO 2 · INVENTARIO · PROVEEDORES · SEMEN</text><circle cx="294" cy="621" r="3.6" fill="#2e7d4f"/><text x="308" y="625" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">Cargás proveedores, productos por etapa y lotes de dosis</text><circle cx="294" cy="652" r="3.6" fill="#2e7d4f"/><text x="308" y="656" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">Definís mínimos de stock y empezás a recibir alertas</text><circle cx="294" cy="683" r="3.6" fill="#2e7d4f"/><text x="308" y="687" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">Se prueba el bastón lector real (spike) y se congela su integración</text><rect x="286" y="720" width="95.89999999999999" height="23.5" rx="11.75" fill="#e4efe6" stroke="#cfe0d4" stroke-width="1"/><text x="333.95" y="735.89" font-family="DejaVu Sans" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">Alcance MVP</text><text x="190" y="832" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#14532d" text-anchor="end">Semanas 7–9</text><text x="190" y="850" font-family="DejaVu Sans" font-size="11" font-weight="700" fill="#8a9a90" text-anchor="end" letter-spacing="0.6">FASE 3</text><rect x="260" y="804" width="892" height="245" rx="16" fill="#ffffff" stroke="#e3ddd2" stroke-width="1"/><text x="286" y="854" font-family="DejaVu Sans" font-size="18.5" font-weight="700" fill="#1c2b22" text-anchor="start">La operación diaria vive en el potrero</text><text x="286" y="880" font-family="DejaVu Sans" font-size="11.5" font-weight="700" fill="#2e7d4f" text-anchor="start" letter-spacing="0.8">MÓDULO 3 · CAMPO · PROTOCOLO 1–7 · ACASALAMIENTO</text><circle cx="294" cy="912" r="3.6" fill="#2e7d4f"/><text x="308" y="916" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">El equipo registra animales, lee chips y avanza las 7 fases con responsable por etapa</text><circle cx="294" cy="943" r="3.6" fill="#2e7d4f"/><text x="308" y="947" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">El acasalamiento descuenta insumos y dosis automáticamente</text><circle cx="294" cy="974" r="3.6" fill="#2e7d4f"/><text x="308" y="978" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">Todo funciona sin señal y sincroniza al volver</text><rect x="286" y="1011" width="95.89999999999999" height="23.5" rx="11.75" fill="#e4efe6" stroke="#cfe0d4" stroke-width="1"/><text x="333.95" y="1026.89" font-family="DejaVu Sans" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">Alcance MVP</text><text x="190" y="1123" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#14532d" text-anchor="end">Semanas 10–12</text><text 