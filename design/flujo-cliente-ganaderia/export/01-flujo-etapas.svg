ns" font-size="13.5" font-weight="400" fill="#4a5a50" text-anchor="start">Registra cada bovino y vincula su</text><text x="866" y="462.86" font-family="DejaVu Sans" font-size="13.5" font-weight="400" fill="#4a5a50" text-anchor="start">serie/chip con el bastón</text><circle cx="853.5" cy="489.86" r="3.4" fill="#2e7d4f"/><text x="866" y="490.86" font-family="DejaVu Sans" font-size="13.5" font-weight="400" fill="#4a5a50" text-anchor="start">Ejecuta las 7 fases del protocolo</text><text x="866" y="510.86" font-family="DejaVu Sans" font-size="13.5" font-weight="400" fill="#4a5a50" text-anchor="start">por equipo responsable</text><circle cx="853.5" cy="537.86" r="3.4" fill="#2e7d4f"/><text x="866" y="538.86" font-family="DejaVu Sans" font-size="13.5" font-weight="400" fill="#4a5a50" text-anchor="start">Registra acasalamiento o</text><text x="866" y="558.86" font-family="DejaVu Sans" font-size="13.5" font-weight="400" fill="#4a5a50" text-anchor="start">inseminación con descuento</text><text x="866" y="578.86" font-family="DejaVu Sans" font-size="13.5" font-weight="400" fill="#4a5a50" text-anchor="start">automático de insumos</text><rect x="850" y="646" width="279.2" height="24" rx="12" fill="#fdf3d7" stroke="#ecd9a0" stroke-width="1"/><text x="989.6" y="662.32" font-family="DejaVu Sans" font-size="12" font-weight="700" fill="#92610f" text-anchor="middle">Funciona sin señal · sincroniza solo</text><path d="M1176 467 L1191 480 L1176 493 Z" fill="#9db3a5"/><rect x="1168" y="478" width="9" height="4" rx="2" fill="#9db3a5"/><rect x="1202" y="268" width="330" height="424" rx="18" fill="#ffffff" stroke="#e3ddd2" stroke-width="1"/><circle cx="1244" cy="310" r="20" fill="#14532d"/><text x="1244" y="317" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1224" y="364" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#1c2b22" text-anchor="start">Controla y decide</text><text x="1224" y="388" font-family="DejaVu