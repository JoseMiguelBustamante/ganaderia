<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="830" viewBox="0 0 1700 830"><rect width="1700" height="830" fill="#faf7f1"/><text x="64" y="96" font-family="DejaVu Sans" font-size="33" font-weight="700" fill="#1c2b22" text-anchor="start" letter-spacing="1">QUÉ PUEDE HACER EL CLIENTE</text><text x="64" y="148" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#4a5a50" text-anchor="start">Las acciones concretas que el sistema habilita, agrupadas por rol.</text><rect x="70" y="220" width="500" height="446" rx="18" fill="#ffffff" stroke="#e3ddd2" stroke-width="1"/><rect x="94" y="244" width="52" height="52" rx="13" fill="#14532d"/><g transform="translate(94,244)"><circle cx="24" cy="17" r="8" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M8 40c1.6-8 8.4-11 16-11s14.4 3 16 11" fill="none" stroke="#fff" stroke-width="2.6"/></g><text x="162" y="266" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#1c2b22" text-anchor="start">Administrador</text><text x="162" y="286" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#4a5a50" text-anchor="start">· dueño de la empresa</text><text x="94" y="324" font-family="DejaVu Sans" font-size="13.5" font-weight="400" fill="#4a5a50" text-anchor="start">Controla la cuenta SaaS y la estructura de la operación</text><line x1="94" y1="342" x2="546" y2="342" stroke="#e3ddd2" stroke-width="1"/><circle cx="103" cy="371.5" r="9" fill="#e4efe6"/><path d="M98.6 371.5 l3 3 l5.4 -6" fill="none" stroke="#14532d" stroke-width="2.2"/><text x="122" y="376" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Crear la propiedad </tspan><tspan fill="#4a5a50">y sumar propiedades secundarias</tspan></text><text x="122" y="396" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#4a5a50" text-anchor="start">asociadas</text><circle cx="103" cy="427.5" r="9" fill="#e4efe6"/><path d="M98.6 427.5 l3 3 l5.4 -6" fill="none" stroke="#14532d" stroke-width="2.2"/><text x="122" y="432" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Invitar usuarios </tspan><tspan fill="#4a5a50">y asignar roles: veterinario,</tspan></text><text x="122" y="452" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#4a5a50" text-anchor="start">capataz, compras</text><circle cx="103" cy="483.5" r="9" fill="#e4efe6"/><path d="M98.6 483.5 l3 3 l5.4 -6" fill="none" stroke="#14532d" stroke-width="2.2"/><text x="122" y="488" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Armar equipos </tspan><tspan fill="#4a5a50">responsables por corral o etapa de</tspan></text><text x="122" y="508" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#4a5a50" text-anchor="start">protocolo</text><circle cx="103" cy="539.5" r="9" fill="#e4efe6"/><path d="M98.6 539.5 l3 3 l5.4 -6" fill="none" stroke="#14532d" stroke-width="2.2"/><text x="122" y="544" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Administrar el plan </tspan><tspan fill="#4a5a50">: activar, subir o pausar la</tspan></text><text x="122" y="564" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#4a5a50" text-anchor="start">suscripción</text><circle cx="103" cy="595.5" r="9" fill="#e4efe6"/><path d="M98.6 595.5 l3 3 l5.4 -6" fill="none" stroke="#14532d" stroke-width="2.2"/><text x="122" y="600" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Ver y exportar </tspan><tspan fill="#4a5a50">tableros, KPIs y reportes del negocio</tspan></text><path d="M581 430 L596 443 L581 456 Z" fill="#9db3a5"/><rect x="573" y="441" width="9" height="4" rx="2" fill="#9db3a5"/><rect x="600" y="220" width="500" height="446" rx="18" fill="#ffffff" stroke="#e3ddd2" stroke-width="1"/><rect x="624" y="244" width="52" height="52" rx="13" fill="#1e5f8a"/><g transform="translate(624,244)"><path d="M24 6v36M14 16h20M17 32h14" fill="none" stroke="#fff" stroke-width="2.6"/></g><text x="692" y="266" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#1c2b22" text-anchor="start">Equipo de campo</text><text x="692" y="286" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#4a5a50" text-anchor="start">· veterinario, capataz</text><text x="624" y="324" font-family="DejaVu Sans" font-size="13.5" font-weight="400" fill="#4a5a50" text-anchor="start">Trabaja el día a día con los animales, en el potrero</text><line x1="624" y1="342" x2="1076" y2="342" stroke="#e3ddd2" stroke-width="1"/><circle cx="633" cy="371.5" r="9" fill="#e3eef7"/><path d="M628.6 371.5 l3 3 l5.4 -6" fill="none" stroke="#1e5f8a" stroke-width="2.2"/><text x="652" y="376" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Registrar bovinos </tspan><tspan fill="#4a5a50">individualmente con su ficha</tspan></text><text x="652" y="396" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#4a5a50" text-anchor="start">completa</text><circle cx="633" cy="427.5" r="9" fill="#e3eef7"/><path d="M628.6 427.5 l3 3 l5.4 -6" fill="none" stroke="#1e5f8a" stroke-width="2.2"/><text x="652" y="432" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Leer la serie o chip </tspan><tspan fill="#4a5a50">con el bastón lector, sin tipear</tspan></text><circle cx="633" cy="463.5" r="9" fill="#e3eef7"/><path d="M628.6 463.5 l3 3 l5.4 -6" fill="none" stroke="#1e5f8a" stroke-width="2.2"/><text x="652" y="468" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Avanzar las 7 fases </tspan><tspan fill="#4a5a50">del protocolo con confirmación</tspan></text><text x="652" y="488" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#4a5a50" text-anchor="start">visual por etapa</text><circle cx="633" cy="519.5" r="9" fill="#e3eef7"/><path d="M628.6 519.5 l3 3 l5.4 -6" fill="none" stroke="#1e5f8a" stroke-width="2.2"/><text x="652" y="524" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Registrar acasalamiento o inseminación: </tspan><tspan fill="#4a5a50">el sistema</tspan></text><text x="652" y="544" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#4a5a50" text-anchor="start">descuenta la dosis y el insumo solo</text><circle cx="633" cy="575.5" r="9" fill="#e3eef7"/><path d="M628.6 575.5 l3 3 l5.4 -6" fill="none" stroke="#1e5f8a" stroke-width="2.2"/><text x="652" y="580" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Trabajar sin señal: </tspan><tspan fill="#4a5a50">guarda en el celular y sincroniza</tspan></text><text x="652" y="600" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#4a5a50" text-anchor="start">cuando vuelve</text><path d="M1111 430 L1126 443 L1111 456 Z" fill="#9db3a5"/><rect x="1103" y="441" width="9" height="4" rx="2" fill="#9db3a5"/><rect x="1130" y="220" width="500" height="446" rx="18" fill="#ffffff" stroke="#e3ddd2" stroke-width="1"/><rect x="1154" y="244" width="52" height="52" rx="13" fill="#b4522a"/><g transform="translate(1154,244)"><path d="M42 16 24 6 6 16v16l18 10 18-10z" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M10 18l14 8 14-8M24 26v14" fill="none" stroke="#fff" stroke-width="2.6"/></g><text x="1222" y="266" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#1c2b22" text-anchor="start">Compras e insumos</text><text x="1222" y="286" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#4a5a50" text-anchor="start">· encargado</text><text x="1154" y="324" font-family="DejaVu Sans" font-size="13.5" font-weight="400" fill="#4a5a50" text-anchor="start">Mantiene el depósito y el control de semen</text><line x1="1154" y1="342" x2="1606" y2="342" stroke="#e3ddd2" stroke-width="1"/><circle cx="1163" cy="371.5" r="9" fill="#f7e8df"/><path d="M1158.6 371.5 l3 3 l5.4 -6" fill="none" stroke="#b4522a" stroke-width="2.2"/><text x="1182" y="376" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Dar de alta proveedores </tspan><tspan fill="#4a5a50">y asociar su historial</tspan></text><circle cx="1163" cy="407.5" r="9" fill="#f7e8df"/><path d="M1158.6 407.5 l3 3 l5.4 -6" fill="none" stroke="#b4522a" stroke-width="2.2"/><text x="1182" y="412" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Ingresar productos </tspan><tspan fill="#4a5a50">marcando a qué etapa del protocolo</tspan></text><text x="1182" y="432" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#4a5a50" text-anchor="start">sirven</text><circle cx="1163" cy="463.5" r="9" fill="#f7e8df"/><path d="M1158.6 463.5 l3 3 l5.4 -6" fill="none" stroke="#b4522a" stroke-width="2.2"/><text x="1182" y="468" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Controlar lotes y dosis de semen </tspan><tspan fill="#4a5a50">por vencimiento y</tspan></text><text x="1182" y="488" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#4a5a50" text-anchor="start">cantidad</text><circle cx="1163" cy="519.5" r="9" fill="#f7e8df"/><path d="M1158.6 519.5 l3 3 l5.4 -6" fill="none" stroke="#b4522a" stroke-width="2.2"/><text x="1182" y="524" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Recibir alertas de stock mínimo </tspan><tspan fill="#4a5a50">antes de quedarse sin</tspan></text><circle cx="1163" cy="555.5" r="9" fill="#f7e8df"/><path d="M1158.6 555.5 l3 3 l5.4 -6" fill="none" stroke="#b4522a" stroke-width="2.2"/><text x="1182" y="560" font-family="DejaVu Sans" font-size="14"><tspan font-weight="700" fill="#1c2b22">Ver el consumo real </tspan><tspan fill="#4a5a50">que cada protocolo descuenta</tspan></text><rect x="64" y="708" width="1572" height="78" rx="14" fill="#fdf3d7" stroke="#ecd9a0" stroke-width="1"/><text x="92" y="740" font-family="DejaVu Sans" font-size="12.5" font-weight="700" fill="#92610f" text-anchor="start" letter-spacing="1">TODOS VEN</text><text x="92" y="772" font-family="DejaVu Sans" font-size="14.5" font-weight="400" fill="#4a5a50" text-anchor="start">alertas tempranas de gestión      ·      historial trazable por animal y por equipo      ·      mismo idioma de datos en web y en campo</text><text x="64" y="808" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#8a9a90" text-anchor="start">Fuente: plan de trabajo v2 (docs/plan-de-trabajo.md) · roles según Módulos 1-4 y 6</text></svg>